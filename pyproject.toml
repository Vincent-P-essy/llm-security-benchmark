[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-security-benchmark"
version = "1.0.0"
description = "A reproducible benchmark for LLM application security: prompt injection, system-prompt extraction, policy circumvention and confidential-data leakage, graded deterministically."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vincent Plessy" }]
keywords = ["llm", "security", "benchmark", "prompt-injection", "red-team", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "PyYAML>=5.4",
    "rich>=13.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.6"]

[project.scripts]
lsb = "lsb.cli:main"

[project.urls]
Homepage = "https://github.com/Vincent-P-essy/llm-security-benchmark"
Issues = "https://github.com/Vincent-P-essy/llm-security-benchmark/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lsb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The script has to extend sys.path before it can import the package it tests.
"scripts/reproduce.py" = ["E402"]
# A readable assertion beats a column limit; wrapping these hurts the tests.
"tests/*" = ["E501"]
