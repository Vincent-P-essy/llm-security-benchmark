name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The corpus is data; a weekly run catches a probe that rots into a
    # grader that can never fire without anyone touching the repo.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

      - name: Validate the corpus
        # Every probe must fire against a target that leaks everything.
        # One that does not has a grader that can never fire, and silently
        # lowers every exposure score it appears in.
        run: lsb validate

  reproduce:
    # The published numbers are derived from a seed, so CI can re-derive them.
    # A benchmark whose results cannot be reproduced from the repo is a claim,
    # not a measurement.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Re-derive the published results
        run: |
          python scripts/reproduce.py

      - name: Gate on the hardened profile
        # If a change lets the hardened profile drift above this, either the
        # corpus got stronger or a defense regressed. Both are worth a red X.
        run: lsb run --target mock:hardened --repeat 5 --seed 1337 --fail-over 25
